<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dynooh SiteManager</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; cursor: default; }
      body { display: flex; align-items: center; justify-content: center; font-family: "Segoe UI", Arial, sans-serif; }
      .card {
        width: 420px; height: 280px; box-sizing: border-box; border-radius: 16px;
        background: linear-gradient(140deg, #5a0c39 0%, #2a0619 55%, #1e1f22 100%);
        border: 1px solid #9c1f66; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #f3d6e6;
      }
      svg { width: 104px; height: 104px; filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.45)); }
      h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: 0.4px; color: #ffd2ea; }
      .sub { font-size: 12px; color: #c99ab4; }
      .bar { position: relative; width: 220px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
      .bar::after {
        content: ""; position: absolute; top: 0; left: -40%; width: 40%; height: 100%; border-radius: 2px;
        background: linear-gradient(90deg, transparent, #ff5fb0, transparent); animation: run 1.1s ease-in-out infinite;
      }
      @keyframes run { to { left: 100%; } }
    </style>
  </head>
  <body>
    <div class="card">
      <svg viewBox="0 0 1024 1024" aria-hidden="true">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#6e0f45" />
            <stop offset="1" stop-color="#3d0626" />
          </linearGradient>
          <linearGradient id="fg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffb3dd" />
            <stop offset="1" stop-color="#ff5fb0" />
          </linearGradient>
        </defs>
        <rect x="32" y="32" width="960" height="960" rx="90" fill="url(#bg)" />
        <rect x="32" y="32" width="960" height="960" rx="90" fill="none" stroke="#9c1f66" stroke-width="12" />
        <text x="512" y="692" text-anchor="middle" font-family="Segoe UI Black, Segoe UI, Arial, sans-serif" font-weight="900" font-size="520" letter-spacing="-14" fill="url(#fg)" stroke="url(#fg)" stroke-width="10" stroke-linejoin="round">Sm</text>
      </svg>
      <h1>Dynooh SiteManager</h1>
      <div class="bar"></div>
      <div class="sub" id="sub">Loading …</div>
    </div>
    <script>
      try {
        const p = JSON.parse(localStorage.getItem("layout:prefs") || "{}");
        if (p.langChosen && p.lang === "de") document.getElementById("sub").textContent = "Wird geladen …";
      } catch {}
    </script>
  </body>
</html>
