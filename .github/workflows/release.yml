name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    env:
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build portable exe
        run: npx tauri build --no-bundle
        env:
          VFSM_MAIL_TOKEN: ${{ secrets.VFSM_MAIL_TOKEN }}

      - name: Collect binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          Copy-Item src-tauri/target/release/vf-sitemanager.exe "dist/dynooh-sitemanager-$version-x64.exe"

      - name: Upload unsigned artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned
          path: dist/*.exe

      - name: Sign with SignPath
        if: env.HAS_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.HAS_SIGNPATH == 'true' && 'signed/*.exe' || 'dist/*.exe' }}
