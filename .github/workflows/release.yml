name: Build check

# Signed releases are built locally with `npm run release` (Certum certificate via SimplySign)
# and uploaded to the GitHub release by the maintainer. This workflow only verifies that the
# tagged source builds and keeps the unsigned binary as an artifact for comparison.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build portable exe
        run: npx tauri build --no-bundle
        env:
          VFSM_MAIL_TOKEN: ${{ secrets.VFSM_MAIL_TOKEN }}

      - name: Collect binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          Copy-Item src-tauri/target/release/vf-sitemanager.exe "dist/dynooh-sitemanager-$version-x64-unsigned.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: unsigned
          path: dist/*.exe
